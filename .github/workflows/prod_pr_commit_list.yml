name: Update PR Description with Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  update-pr-description:
    if: github.base_ref == 'main' && github.head_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit list
        id: commits
        run: |
          COMMIT_LIST=$(git log --pretty=format:'[] [%h](https://github.com/${{ github.repository }}/commit/%H) by @%an' origin/main..HEAD)
          echo "COMMIT_LIST<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_LIST" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update PR description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          DESCRIPTION=$(gh pr view $PR_NUMBER --repo $REPO --json body -q .body)
          NEW_DESCRIPTION="$DESCRIPTION\n\n### Commit List:\n${COMMIT_LIST}"
          gh pr edit $PR_NUMBER --repo $REPO --body "$NEW_DESCRIPTION"
        shell: bash
