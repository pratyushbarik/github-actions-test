name: Update PR Description with Commits

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  update-pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Get Commit List
        id: commits
        run: |
          COMMITS=$(gh pr view "$PR_NUMBER" --json commits -q ".commits[].oid")
          AUTHORS=$(gh pr view "$PR_NUMBER" --json commits -q ".commits[].author.login")
          COMMIT_LIST=""
          INDEX=0
          while read -r COMMIT && read -r AUTHOR <&3; do
            COMMIT_LIST+="- [ ] [${COMMIT}](https://github.com/${{ github.repository }}/commit/${COMMIT}) by @${AUTHOR}
"
            ((INDEX++))
          done <<<"$COMMITS" 3<<<"$AUTHORS"
          echo "commit_list<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_LIST" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Update PR Description
        run: |
          PR_DESC=$(gh pr view "$PR_NUMBER" --json body -q .body)
          UPDATED_DESC="${PR_DESC}\n\n### Commit List\n$commit_list"
          gh pr edit "$PR_NUMBER" --body "$UPDATED_DESC"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
