name: Update PR Commit List

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  update-pr-description:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit list
        run: |
          COMMITS=$(git log origin/main..origin/develop --pretty=format:"- [ ] [%h](https://github.com/${{ github.repository }}/commit/%H) by @%an" | tr '\n' '\n')
          echo "COMMIT_LIST<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update PR description
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: prNumber,
            });
            
            const commitSectionHeader = "### Commit List";
            const commitList = process.env.COMMIT_LIST;
            let newBody;
            
            if (pr.body.includes(commitSectionHeader)) {
              newBody = pr.body.replace(/### Commit List[\s\S]*$/, `${commitSectionHeader}\n${commitList}`);
            } else {
              newBody = `${pr.body}\n\n${commitSectionHeader}\n${commitList}`;
            }
            
            await github.rest.pulls.update({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: prNumber,
              body: newBody,
            });
